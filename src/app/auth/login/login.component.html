<div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form (submit)="onSubmit()">
      <div class="form-group">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" [(ngModel)]="username" name="usuario" placeholder="Ingresa tu usuario" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Ingresa tu contraseña" required>
      </div>
      <button type="submit">Iniciar Sesión</button>
    </form>
  </div>
